<!doctype html>
<html lang="fa">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="این سایت برای سفارش آنلاین غذا و ارسال از طریق پیک می باشد."
    />
    <meta
      name="keywords"
      content="سفارش غذا، سفارش آنلاین، ارسال غذا، food delivery, online shop, food"
    />
    <meta name="author" content="Reza Mohammadi" />
    <meta name="robots" content="index, follow" />
    <link rel="icon" href="./images/favicons/favicon.1.png" sizes="16x16" />
    <link rel="icon" href="./images/favicons/favicon.2.png" sizes="32x32" />
    <link rel="icon" href="./images/favicons/favicon.3.png" sizes="48x48" />
    <link rel="icon" href="./images/favicons/favicon.4.png" sizes="64x64" />
    <link rel="stylesheet" href="./css/register_styles.css" />
    <script
      src="https://kit.fontawesome.com/3e0182d512.js"
      crossorigin="anonymous"
    ></script>
    <title>عضویت</title>
  </head>
  <body>
    <main role="main">
      <section class="register-main__box" id="register-main-box">
        <div id="popup-form" class="active">
          <form
            action="#"
            method="post"
            id="register-form"
            class="active"
            novalidate
          >
            <h2>فرم عضویت در رستوران</h2>
            <div>
              <label for="name">نام</label>
              <input
                type="text"
                name="name"
                id="name"
                class="form-control"
                data-validation="notEmptyName isBetweenName"
              />
            </div>
            <div>
              <label for="family">نام خانوادگی</label>
              <input
                type="text"
                name="family"
                id="family"
                class="form-control"
                data-validation="notEmptyFamily isBetweenFamily"
              />
            </div>
            <div>
              <label for="mobile">موبایل</label>
              <input
                type="tel"
                name="mobile"
                id="mobile"
                class="form-control"
                data-validation="notEmptyMobile isMobile"
              />
            </div>
            <div>
              <button type="submit" class="form-control">ثبت نام</button>
            </div>
            <ul class="summary-validation" id="error-list"></ul>
          </form>
          <div class="btn-popup active" id="btn-popup"></div>
        </div>
      </section>
    </main>
    <script src="./js/register_script.js"></script>
  </body>
</html>
